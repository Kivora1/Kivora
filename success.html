<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merci – KIVORA</title><meta name="robots" content="noindex">
<style>:root{--ink:#2c332f;--mut:#76807a;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;padding:40px 24px;font-family:system-ui,sans-serif;color:var(--ink);background:radial-gradient(40% 34% at 10% 6%,#dcefe6,transparent 70%),radial-gradient(36% 30% at 92% 20%,#fbe3d9,transparent 70%),radial-gradient(44% 34% at 72% 96%,#dfe7f6,transparent 70%),#faf8f4}
h1{margin:0 0 10px;font:300 clamp(1.9rem,5vw,2.7rem)/1.15 var(--serif)}p{margin:0 0 18px;max-width:30em;font:1.05rem/1.7 var(--serif);color:#3d4540}
#stp{width:170px;height:170px;filter:drop-shadow(0 6px 6px rgba(50,60,55,.28));margin:0 0 22px;opacity:0}#stp.go{animation:thud .7s cubic-bezier(.3,1.5,.5,1) .3s forwards}
@keyframes thud{0%{opacity:0;transform:scale(1.7) rotate(-14deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(-5deg)}}
#st{font:italic 1.05rem var(--serif);color:#4f7561;min-height:1.6em}a{color:#4f7561}.btn{display:inline-block;margin-top:10px;padding:13px 30px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;letter-spacing:.12em;font-size:.78rem;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){#stp.go{animation:none;opacity:1;transform:rotate(-5deg)}}</style></head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="lf"><path d="M0 0C11-12 9-42 1-64C-9-44-10-14 0 0Z" fill="currentColor" fill-opacity=".7" stroke="currentColor" stroke-opacity=".55" stroke-width="1"/><path d="M0-3C1-24 1-44 1-58" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width=".8"/></g>
<g id="rl"><path d="M0 0C12-6 14-22 0-26C-14-22-12-6 0 0Z" fill="currentColor" fill-opacity=".7" stroke="currentColor" stroke-opacity=".5" stroke-width=".9"/><path d="M0-2V-21" stroke="currentColor" stroke-opacity=".35" stroke-width=".7"/></g>
<g id="pt"><path d="M0 0C-9-6-10-21 0-26C10-21 9-6 0 0Z" fill="currentColor" fill-opacity=".68" stroke="currentColor" stroke-opacity=".5" stroke-width=".8"/></g>
<g id="fl"><use href="#pt"/><use href="#pt" transform="rotate(72)"/><use href="#pt" transform="rotate(144)"/><use href="#pt" transform="rotate(216)"/><use href="#pt" transform="rotate(288)"/><circle r="3" fill="#c97b5f" fill-opacity=".85"/></g><g id="ol"><ellipse rx="3.8" ry="5.4" cy="-4" fill="#4a2f48" fill-opacity=".88"/></g><g id="bb"><circle r="2.4" cy="-2" fill="#6f87a3" fill-opacity=".85"/></g></defs></svg>
<div id="stp" aria-hidden="true"></div>
<h1>Merci pour votre commande !</h1><p>Votre paiement a bien été reçu. Nous préparons votre commande.</p>
<p id="st"></p><a class="btn" href="/">Retour à la boutique</a>
<script>try{localStorage.removeItem('cart');localStorage.setItem('kv_bought','1');
var KC={home:['#cfe0d3','#8fb09b','#4f7561'],everyday:['#f6d6c8','#d9987f','#a4614a'],essentials:['#cddae6','#88a4c0','#4d6f8c']};
function U(s,x,y,r,k,c){return'<use href="#'+s+'" transform="translate('+x+' '+y+') rotate('+r+') scale('+k+')"'+(c?' style="color:'+c+'"':'')+'/>'}
function emb(c){var o='',k,P,C;
if(c==='home'){C=['#7e8f78','#5f7380','#94a08a'];o='<path d="M34 68C42 60 54 46 68 34" fill="none" stroke="#8a8f7a" stroke-width="1.6" stroke-linecap="round"/>';P=[[40,62],[47,55],[54,48],[61,41]];for(k=0;k<4;k++)o+=U('lf',P[k][0],P[k][1],100,.26,C[k%3])+U('lf',P[k][0],P[k][1],-12,.26,C[(k+1)%3]);o+=U('lf',68,34,45,.28,C[0])+U('ol',48,64,160,.9)+U('ol',57,56,160,.9)}
else if(c==='everyday'){o='<path d="M34 70C44 62 54 56 62 42" fill="none" stroke="#8d7466" stroke-width="1.5" stroke-linecap="round"/>'+U('lf',39,67,60,.2,'#9fb394')+U('lf',49,60,-40,.2,'#9fb394')+U('fl',64,38,0,.46,'#f0c3b0')+U('fl',43,52,0,.42,'#e9b9a2')+U('fl',57,58,0,.38,'#f0c3b0')}
else{C=['#8ea6bf','#a9bfd3','#7f98b3'];o='<path d="M50 74C50 62 50 46 50 30" fill="none" stroke="#7d8f9c" stroke-width="1.5" stroke-linecap="round"/>';P=[64,55,46,37];for(k=0;k<4;k++)o+=U('rl',50,P[k],72,.5,C[k%3])+U('rl',50,P[k],-72,.5,C[(k+1)%3]);o+=U('rl',50,32,0,.5,C[0])+U('bb',44,60,0,1)+U('bb',56,50,0,1)}
return c==='home'?'<g transform="translate(5 8) scale(.88)">'+o+'</g>':o}
function stp(i,on,cat){var p='';for(var a=0;a<=360;a+=2){var t=a*Math.PI/180,r=45+2.6*Math.cos(18*t);p+=(a?'L':'M')+(50+r*Math.cos(t)).toFixed(1)+' '+(50+r*Math.sin(t)).toFixed(1)}p+='Z';
if(!on)return'<svg viewBox="0 0 100 100"><path d="'+p+'" fill="none" stroke="#c9cfca" stroke-dasharray="3 3"/><text x="50" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#c9cfca">'+(i+1)+'</text></svg>';
var K=KC[cat]||KC.home;
return'<svg class="on" viewBox="0 0 100 100" style="transform:rotate('+((i*37%11)-5)+'deg)"><defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+K[0]+'"/><stop offset="1" stop-color="'+K[1]+'"/></linearGradient><radialGradient id="p'+i+'" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f1ede3"/></radialGradient><path id="t'+i+'" d="M50 50m-34.2 0a34.2 34.2 0 1 1 68.4 0a34.2 34.2 0 1 1-68.4 0"/></defs><path d="'+p+'" fill="url(#g'+i+')" stroke="'+K[1]+'" stroke-width=".8"/><circle cx="50" cy="50" r="39" fill="url(#p'+i+')" stroke="'+K[1]+'" stroke-width=".7"/><circle cx="50" cy="50" r="31" fill="'+K[0]+'" fill-opacity=".28"/><circle cx="50" cy="50" r="31" fill="none" stroke="'+K[1]+'" stroke-width=".5" stroke-dasharray="1 2"/><text font-family="Georgia,serif" font-size="4.6" fill="'+K[2]+'" letter-spacing="1.4"><textPath href="#t'+i+'" textLength="212" lengthAdjust="spacing">KIVORA · ATELIER · KIVORA · ATELIER ·</textPath></text>'+emb(cat||'home')+'<text x="50" y="78" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="4.6" fill="'+K[2]+'">n° '+(i+1)+'</text><ellipse cx="38" cy="24" rx="22" ry="8" transform="rotate(-30 38 24)" fill="#fff" fill-opacity=".3"/></svg>'}
var id=new URLSearchParams(location.search).get('session_id'),S=JSON.parse(localStorage.getItem('kv_stamps')||'[]');
S=S.map(function(e,i){return typeof e==='string'?{id:e,c:'home'}:e});
if(id&&!S.some(function(e){return e.id===id})){var cat=localStorage.getItem('kv_pending');if(!KC[cat])cat='home';localStorage.removeItem('kv_pending');S.push({id:id,c:cat});localStorage.setItem('kv_stamps',JSON.stringify(S));
document.getElementById('stp').innerHTML=stp(S.length-1,true,cat);document.getElementById('stp').classList.add('go');
document.getElementById('st').innerHTML='Votre tampon n° '+S.length+' vient d’être ajouté à votre carnet. <a href="/atelier.html">Voir l’atelier</a>'}}catch(e){}</script></body></html>
