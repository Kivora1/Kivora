<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merci – KIVORA</title><meta name="robots" content="noindex">
<style>:root{--ink:#2c332f;--mut:#76807a;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-content:center;justify-items:center;text-align:center;padding:40px 24px;font-family:system-ui,sans-serif;color:var(--ink);background:#faf8f4 radial-gradient(40% 34% at 10% 6%,#dcefe6,transparent 70%),radial-gradient(36% 30% at 92% 20%,#fbe3d9,transparent 70%),radial-gradient(44% 34% at 72% 96%,#dfe7f6,transparent 70%)}
h1{margin:0 0 10px;font:300 clamp(1.9rem,5vw,2.7rem)/1.15 var(--serif)}p{margin:0 0 18px;max-width:30em;font:1.05rem/1.7 var(--serif);color:#3d4540}
#stp{width:130px;height:130px;margin:0 0 22px;opacity:0}#stp.go{animation:thud .7s cubic-bezier(.3,1.5,.5,1) .3s forwards}
@keyframes thud{0%{opacity:0;transform:scale(1.7) rotate(-14deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(-5deg)}}
#st{font:italic 1.05rem var(--serif);color:#4f7561;min-height:1.6em}a{color:#4f7561}.btn{display:inline-block;margin-top:10px;padding:13px 30px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;letter-spacing:.12em;font-size:.78rem;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){#stp.go{animation:none;opacity:1;transform:rotate(-5deg)}}</style></head>
<body><svg id="stp" viewBox="0 0 100 100" aria-hidden="true"></svg>
<h1>Merci pour votre commande !</h1><p>Votre paiement a bien été reçu. Nous préparons votre commande.</p>
<p id="st"></p><a class="btn" href="/">Retour à la boutique</a>
<script>try{localStorage.removeItem('cart');localStorage.setItem('kv_bought','1');
var id=new URLSearchParams(location.search).get('session_id'),S=JSON.parse(localStorage.getItem('kv_stamps')||'[]');
if(id&&S.indexOf(id)<0){S.push(id);localStorage.setItem('kv_stamps',JSON.stringify(S))
var c=['#a9c4b0','#e9b9a2','#a9bfd3'][(S.length-1)%3],p='';for(var a=0;a<=360;a+=2){var t=a*Math.PI/180,r=44+3.2*Math.cos(18*t);p+=(a?'L':'M')+(50+r*Math.cos(t)).toFixed(1)+' '+(50+r*Math.sin(t)).toFixed(1)}
var m='style="mix-blend-mode:multiply"';
document.getElementById('stp').innerHTML='<path d="'+p+'Z" fill="'+c+'" fill-opacity=".3" stroke="#3d4540" stroke-width="1.2"/><circle cx="50" cy="50" r="33" fill="none" stroke="#3d4540" stroke-width=".7" stroke-dasharray="1.5 2.5"/><circle cx="50" cy="41" r="11" fill="#a9c4b0" '+m+'/><circle cx="43" cy="54" r="11" fill="#e9b9a2" '+m+'/><circle cx="57" cy="54" r="11" fill="#a9bfd3" '+m+'/><text x="50" y="79" text-anchor="middle" font-family="Georgia,serif" font-size="6.5" letter-spacing="2" fill="#3d4540">KIVORA</text>';
document.getElementById('stp').classList.add('go');
document.getElementById('st').innerHTML='Un tampon vient d’être ajouté à votre carnet. <a href="/atelier.html">Voir l’atelier</a>'}}catch(e){}</script></body></html>
