<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Page introuvable – KIVORA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='14' r='12' fill='%23a9c4b0'/%3E%3Ccircle cx='13' cy='26' r='12' fill='%23e9b9a2' fill-opacity='.85'/%3E%3Ccircle cx='27' cy='26' r='12' fill='%23a9bfd3' fill-opacity='.85'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;--cream:#faf8f4;--ink:#2c332f;--mut:#76807a;--line:#e6e2da;--serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;filter:blur(12px);background:radial-gradient(40% 34% at 10% 6%,#dcefe6,transparent 70%),radial-gradient(36% 30% at 92% 20%,#fbe3d9,transparent 70%),radial-gradient(44% 34% at 72% 96%,#dfe7f6,transparent 70%)}
header{padding:22px 28px;border-bottom:1px solid var(--line);background:var(--cream);text-align:center}
.logo{margin:0;font:300 1.75rem var(--serif);letter-spacing:.34em;padding-left:.34em;text-transform:uppercase;line-height:1}
.logo svg{height:.95em;width:.95em;vertical-align:-.12em;margin:0 .1em 0 .02em;overflow:visible}
.logo circle{mix-blend-mode:multiply;opacity:.85}
main{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;padding:48px 24px}
.leaf{width:64px;height:90px;overflow:visible;animation:drift 5s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(-14px,-6px) rotate(-24deg)}50%{transform:translate(14px,10px) rotate(20deg)}100%{transform:translate(-6px,26px) rotate(-8deg)}}
.eb{margin:22px 0 0;font-size:.7rem;letter-spacing:.32em;color:#4f7561}
h1{margin:10px 0 12px;font:300 clamp(1.9rem,5vw,2.8rem)/1.15 var(--serif)}
p{margin:0 0 24px;max-width:30em;font:italic 1.05rem/1.6 var(--serif);color:var(--mut)}
.btn{display:inline-block;padding:13px 30px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;letter-spacing:.12em;font-size:.78rem;text-transform:uppercase}
.go{display:block;margin-top:18px;font:italic .98rem var(--serif);color:#4f7561;text-decoration:underline;text-decoration-color:#a9c4b0;text-underline-offset:5px}
@media(prefers-reduced-motion:reduce){.leaf{animation:none}}
.cup{overflow:visible}.hl{animation:l 3.2s ease-in-out infinite alternate}.hr{animation:r 3.2s ease-in-out infinite alternate}@keyframes l{to{transform:translateX(-7px)}}@keyframes r{to{transform:translateX(7px)}}@media(prefers-reduced-motion:reduce){.hl,.hr{animation:none}}
</style></head><body>
<header><div class="logo">KIV<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="14" r="12" fill="#a9c4b0"/><circle cx="13" cy="26" r="12" fill="#e9b9a2"/><circle cx="27" cy="26" r="12" fill="#a9bfd3"/></svg>RA</div></header>
<main><svg class="cup" viewBox="0 0 120 90" width="120" height="90" aria-hidden="true"><g class="hl"><path d="M60 14H14C14 56 34 78 60 78Z" fill="#fffdf8" stroke="#2c332f" stroke-width="1.3" stroke-linejoin="round"/><path d="M18 26C28 34 44 38 56 36" fill="none" stroke="#b8935a" stroke-width="1.2"/></g><g class="hr"><path d="M60 14H106C106 56 86 78 60 78Z" fill="#fffdf8" stroke="#2c332f" stroke-width="1.3" stroke-linejoin="round"/><path d="M104 26C94 34 78 38 64 36" fill="none" stroke="#b8935a" stroke-width="1.2"/></g></svg>
<div class="eb">404</div><h1>Cette page a été coupée en deux</h1><p>L’autre moitié est introuvable, ou pas encore dessinée. Reprenez la route vers la boutique.</p>
<a class="btn" href="/">Retour à la boutique</a><a class="go" href="/atelier.html">Visiter l’atelier</a></main>
</body></html>
